name: ai-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcd
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: ai-rag-documents
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"

  api:
    build:
      context: ./apps/api
    environment:
      APP_NAME: AI-RAG
      API_CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MAX_DOCUMENT_SIZE_MB: "20"
      MAX_DOCUMENT_PAGES: "100"
      MAX_CONCURRENT_INGESTIONS_PER_TENANT: "2"
      OPENAI_EMBED_MODEL: text-embedding-3-small
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ai-rag-documents
      S3_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcd
      S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_USE_PATH_STYLE: "true"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      garage:
        condition: service_started

  worker:
    build:
      context: ./apps/api
    command: celery -A app.infrastructure.worker.celery_app:celery_app worker --loglevel=INFO
    environment:
      APP_NAME: AI-RAG
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MAX_DOCUMENT_SIZE_MB: "20"
      MAX_DOCUMENT_PAGES: "100"
      MAX_CONCURRENT_INGESTIONS_PER_TENANT: "2"
      OPENAI_EMBED_MODEL: text-embedding-3-small
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ai-rag-documents
      S3_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcd
      S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_USE_PATH_STYLE: "true"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      qdrant:
        condition: service_started

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  garage_meta:
  garage_data:
