[project]
name = "ai-rag"
version = "0.1.0"
description = "AI Knowledge Assistant grounded in organization documents."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.7",
  "pydantic-settings==2.14.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "celery==5.4.0",
  "PyJWT[crypto]==2.14.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "argon2-cffi==23.1.0",
  "psycopg[binary]==3.2.9",
  "boto3==1.43.98",
  "python-multipart==0.0.20",
  "qdrant-client==1.13.3",
  "openai==3.14.0",
  "docling-core[chunking-openai]==2.104.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
]
worker = [
  "docling==2.142.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
