apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ai-rag-worker:latest
          command:
            - celery
            - -A
            - app.infrastructure.worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=1
            - --max-tasks-per-child=1
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 6Gi
          env:
            - name: DOCLING_ARTIFACTS_PATH
              value: /opt/docling/models
          envFrom:
            - secretRef:
                name: ai-rag-env
