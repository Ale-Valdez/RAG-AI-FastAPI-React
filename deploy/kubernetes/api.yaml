apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ai-rag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-rag-env
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-rag
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
