apiVersion: v1
kind: Secret
metadata:
  name: ai-rag-env
  namespace: ai-rag
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app:REPLACE_ME@postgres.example:5432/app?sslmode=require"
  REDIS_URL: "redis://redis.example:6379/0"
  QDRANT_URL: "http://qdrant.example:6333"
  S3_ENDPOINT_URL: ""
  S3_BUCKET: "ai-rag-documents"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  S3_USE_PATH_STYLE: "false"
  OPENAI_API_KEY: ""
  # Placeholder. The API refuses to start until this is a long random value.
  JWT_SECRET: ""
